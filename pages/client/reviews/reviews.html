<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews | PLMun Reservation &amp; Borrowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/base.css">
<link rel="stylesheet" href="../../../assets/css/layout.css">
<link rel="stylesheet" href="../../../assets/css/components.css">
<link rel="stylesheet" href="reviews.css">
</head>
<body>
<div id="nav"></div>
<main class="page">
  <div class="page-head"><div><h1 style="font-size:2.2rem">Reviews</h1><p>Honest feedback, product by product. Scroll down to read the reviews for each item.</p></div></div>
  <div class="card overall" id="overall"></div>
  <div class="card write" id="write" hidden>
    <h3>Review a product you borrowed</h3>
    <p class="muted small" style="margin-top:-4px">These stay here until you have reviewed them.</p>
    <div class="field"><label class="f" for="rid">Product you borrowed</label><select id="rid"></select></div>
    <div class="starpick" id="sp">
      <button type="button" data-n="1" aria-label="1 star">★</button><button type="button" data-n="2" aria-label="2 stars">★</button><button type="button" data-n="3" aria-label="3 stars">★</button><button type="button" data-n="4" aria-label="4 stars">★</button><button type="button" data-n="5" aria-label="5 stars">★</button>
    </div>
    <div class="field"><textarea id="cm" placeholder="How was this product? Condition, cleanliness, how well it worked…"></textarea></div>
    <div id="msg"></div><button class="btn" id="sv">Post review</button>
  </div>
  <nav class="chips jump" id="jump" aria-label="Jump to a product" hidden></nav>
  <div id="list"></div>
</main>
<footer class="foot" id="foot"></footer>
<script src="../../../assets/js/app.js"></script>
<script src="reviews.js"></script>
</body>
</html>
