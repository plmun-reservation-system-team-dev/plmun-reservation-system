<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password | PLMun Reservation &amp; Borrowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/base.css">
<link rel="stylesheet" href="../../../assets/css/layout.css">
<link rel="stylesheet" href="../../../assets/css/components.css">
<link rel="stylesheet" href="forgot-password.css">
</head>
<body>
<main class="stage">
  <section class="hero-side" aria-hidden="true">
    <div class="hero-copy">
      <img src="../../../assets/img/logo.png" alt="" class="seal">
      <h1>Back in <em>no time.</em></h1>
      <p>We will email a one-time code to the address on your account so you can choose a new password.</p>
    </div>
  </section>
  <section class="panel">
    <div class="box">
      <h2>Forgot your password?</h2>
      <p class="muted" id="sub">Enter your account email and we will send you a 6-digit code.</p>
      <div id="msg"></div>
      <form id="f" novalidate>
        <div class="field"><label class="f" for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@gmail.com" required></div>
        <button class="btn block" id="go" type="submit">Send code</button>
      </form>
      <form id="rf" novalidate hidden>
        <p class="muted" id="rinfo"></p>
        <div class="field"><label class="f" for="code">Code from your email</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456" style="letter-spacing:6px;font-size:1.4rem;text-align:center" required></div>
        <div class="row">
          <div class="field"><label class="f" for="pw">New password</label><input id="pw" type="password" autocomplete="new-password" minlength="6" required></div>
          <div class="field"><label class="f" for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" required></div>
        </div>
        <button class="btn block" id="rgo" type="submit">Update password</button>
        <p class="alt"><button type="button" id="resend" style="background:none;border:0;padding:0;color:var(--green-700);font:inherit;font-weight:700;cursor:pointer">Resend code</button> · <button type="button" id="back" style="background:none;border:0;padding:0;color:var(--green-700);font:inherit;font-weight:700;cursor:pointer">Use a different email</button></p>
      </form>
      <p class="alt">Remembered it? <a href="../../../index.html">Log in</a></p>
    </div>
  </section>
</main>
<script src="../../../assets/js/app.js"></script>
<script src="forgot-password.js"></script>
</body>
</html>
